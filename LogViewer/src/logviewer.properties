# ============================================================
#  LogViewer 설정 파일
#
#  배치 위치 (선택):
#    A) WEB-INF/classes/logviewer.properties  (클래스패스 루트, 기본)
#    B) 외부 파일 시스템 경로 (재시작 없이 변경 가능)
#       → Tomcat JVM 옵션 추가:
#         -Dlogviewer.config.path=/서버경로/logviewer.properties
# ============================================================

# ------------------------------------------------------------
# 대상 로그 파일
# ------------------------------------------------------------
# 읽을 *.log 파일의 절대 경로
logviewer.file.path=/app/logs/application.log

# 로그 파일 인코딩 (UTF-8 또는 EUC-KR)
logviewer.file.encoding=UTF-8

# ------------------------------------------------------------
# 조회 조건  ※ 날짜 또는 키워드 중 하나 이상 필수
# ------------------------------------------------------------

# 날짜/시간 LIKE 조건 (비워두면 날짜 조건 없이 키워드만 검색)
#   포함 여부(LIKE)로 판단하므로 분 단위까지만 써도 해당 분 전체가 매칭된다.
#   예) 2024-03-15 09:14  →  해당 분(分) 전체 매칭
#   예) 2024-03-15        →  해당 날짜 전체 매칭
logviewer.condition.datetime=

# 키워드 목록 (쉼표 구분, 복수 키워드는 OR 조합)
#   날짜 조건과 함께 쓰면  날짜 AND 키워드  조합으로 동작한다.
#   예) NullPointerException,user01,결제 처리 중단
logviewer.condition.keywords=

# ------------------------------------------------------------
# 발췌 옵션
# ------------------------------------------------------------
# 매칭 Row 기준 위아래로 발췌할 줄 수
logviewer.context.lines=10

# 다운로드 파일명 접두사  (결과 예: extract_20240315_091400.log)
logviewer.output.prefix=extract

# ------------------------------------------------------------
# 보안: 허용 기준 디렉토리  (경로 탐색 공격 방지)
#   지정된 디렉토리 외부 경로 접근을 차단한다.
#   비워두면 검사를 생략한다 (비권장).
# ------------------------------------------------------------
logviewer.allowed.basedir=/app/logs/
