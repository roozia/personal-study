# ============================================================
#  LogViewer 설정 파일 (Python 버전)
#  Java 버전의 src/logviewer.properties 와 동일한 형식
# ============================================================

# 대상 로그 파일 절대 경로
logviewer.file.path=C:/personalStudy/MyLogTool/logs/sample.log

# 로그 파일 인코딩 (UTF-8 또는 EUC-KR)
logviewer.file.encoding=UTF-8

# 날짜/시간 LIKE 조건 (비워두면 날짜 조건 없이 키워드만 검색)
logviewer.condition.datetime=

# 키워드 목록 (쉼표 구분, 복수 키워드는 OR 조합)
logviewer.condition.keywords=ERROR

# 매칭 Row 기준 위아래로 발췌할 줄 수
logviewer.context.lines=10

# 다운로드 파일명 접두사
logviewer.output.prefix=extract

# 보안: 허용 기준 디렉토리
logviewer.allowed.basedir=C:/personalStudy/MyLogTool/logs/
